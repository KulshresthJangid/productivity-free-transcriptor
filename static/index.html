<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hinglish Transcriptor</title>
<style>
  :root { --bg:#fff; --fg:#1b1d21; --muted:#6b7280; --line:#e3e5ea; --accent:#2f5bea; --card:#f6f7f9; --err:#c62828; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14161a; --fg:#e8eaee; --muted:#9aa1ad; --line:#2a2e36; --accent:#6b8cff; --card:#1c1f25; --err:#ef7b7b; } }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  body { margin:0; font:16px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  .muted { color:var(--muted); }
  input, select, button { font:inherit; padding:9px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
  button { cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin:16px 0; }

  #auth { max-width:380px; margin:12vh auto 0; padding:0 16px; }
  #auth form { display:flex; flex-direction:column; gap:12px; margin-top:20px; }
  #autherr { color:var(--err); min-height:1.4em; font-size:.9rem; }
  #toggle { background:none; border:none; color:var(--accent); padding:0; text-decoration:underline; }

  #app { display:grid; grid-template-columns:260px 1fr; min-height:100vh; }
  aside { border-right:1px solid var(--line); padding:20px 16px; background:var(--card); }
  aside h2 { font-size:.8rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:20px 0 8px; }
  .item { display:flex; justify-content:space-between; gap:8px; padding:8px 10px; border-radius:8px; cursor:pointer; font-size:.9rem; }
  .item:hover, .item.active { background:var(--line); }
  .item span.t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item button { padding:0 6px; border:none; background:none; color:var(--muted); }
  main { padding:28px 24px 64px; max-width:820px; width:100%; }
  #drop { border:2px dashed var(--line); border-radius:12px; padding:34px 16px; text-align:center; cursor:pointer; background:var(--card); }
  #drop.over { border-color:var(--accent); }
  progress { width:100%; height:10px; }
  #status { color:var(--muted); font-size:.9rem; min-height:1.4em; }
  #out { white-space:pre-wrap; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; min-height:120px; margin-top:12px; }
  #out div { margin-bottom:4px; }
  .ts { color:var(--muted); font-size:.8rem; margin-right:8px; font-variant-numeric:tabular-nums; }
  @media (max-width:760px) { #app { grid-template-columns:1fr; } aside { border-right:none; border-bottom:1px solid var(--line); } }
</style>
</head>
<body>

<section id="auth" hidden>
  <h1>Hinglish Transcriptor</h1>
  <p class="muted">Sign in to transcribe audio and video into Hinglish.</p>
  <form id="authform">
    <input id="email" type="email" placeholder="Email" autocomplete="email" required>
    <input id="password" type="password" placeholder="Password (8+ characters)" minlength="8" autocomplete="current-password" required>
    <button class="primary" id="authbtn">Log in</button>
    <div id="autherr"></div>
  </form>
  <span class="muted" id="switchtext">No account?</span> <button id="toggle">Sign up</button>
</section>

<div id="app" hidden>
  <aside>
    <strong id="who"></strong><br>
    <button id="logout" style="margin-top:8px">Log out</button>
    <h2>History</h2>
    <div id="history"></div>
  </aside>
  <main>
    <h1>New transcription</h1>
    <p class="muted">Any audio or video, any length. The file is deleted from the server as soon as it is transcribed; only the text is saved to your history.</p>

    <div id="drop">Drop a file here or click to choose<br><small id="fname" class="muted"></small></div>
    <input id="file" type="file" accept="audio/*,video/*,.mkv,.opus,.m4a,.amr,.wma" hidden>

    <div class="row">
      <label>Output
        <select id="lang">
          <option value="hi">Hinglish (Roman script)</option>
          <option value="auto">Auto-detect language</option>
          <option value="en">English</option>
        </select>
      </label>
      <button id="go" class="primary" disabled>Transcribe</button>
      <button id="stop" disabled>Stop</button>
    </div>

    <progress id="bar" value="0" max="100" hidden></progress>
    <div id="status"></div>
    <div id="out"></div>

    <div class="row">
      <button id="copy" disabled>Copy text</button>
      <button id="dltxt" disabled>Download .txt</button>
      <button id="dlsrt" disabled>Download .srt</button>
    </div>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
let file = null, segs = [], ctrl = null, title = 'transcript', mode = 'login', activeId = null;

async function api(path, opts = {}) {
  const res = await fetch(path, { credentials: 'same-origin', ...opts });
  if (res.status === 401 && path !== '/api/login') { showAuth(); throw new Error('Not logged in'); }
  return res;
}

// ---------- auth ----------
function showAuth() { $('auth').hidden = false; $('app').hidden = true; }
async function showApp(user) {
  $('auth').hidden = true; $('app').hidden = false; $('who').textContent = user.email;
  loadHistory();
}
function setMode(m) {
  mode = m;
  $('authbtn').textContent = m === 'login' ? 'Log in' : 'Create account';
  $('toggle').textContent = m === 'login' ? 'Sign up' : 'Log in';
  $('switchtext').textContent = m === 'login' ? 'No account?' : 'Already registered?';
  $('password').autocomplete = m === 'login' ? 'current-password' : 'new-password';
  $('autherr').textContent = '';
}
$('toggle').onclick = () => setMode(mode === 'login' ? 'register' : 'login');
$('authform').onsubmit = async e => {
  e.preventDefault();
  $('autherr').textContent = '';
  const res = await fetch('/api/' + mode, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
    body: JSON.stringify({ email: $('email').value, password: $('password').value })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    $('autherr').textContent = typeof data.detail === 'string' ? data.detail : 'Check your email and password (8+ characters).';
    return;
  }
  $('password').value = '';
  showApp(data);
};
$('logout').onclick = async () => { await fetch('/api/logout', { method: 'POST' }); location.reload(); };

// ---------- history ----------
async function loadHistory() {
  const res = await api('/api/transcripts');
  const items = await res.json();
  const box = $('history'); box.textContent = '';
  if (!items.length) { box.innerHTML = '<span class="muted">Nothing yet</span>'; return; }
  for (const t of items) {
    const row = document.createElement('div');
    row.className = 'item' + (t.id === activeId ? ' active' : '');
    const name = document.createElement('span'); name.className = 't'; name.textContent = t.title;
    name.title = new Date(t.created_at).toLocaleString();
    const del = document.createElement('button'); del.textContent = '×'; del.title = 'Delete';
    row.append(name, del);
    row.onclick = () => openTranscript(t.id);
    del.onclick = async ev => {
      ev.stopPropagation();
      if (!confirm('Delete "' + t.title + '"?')) return;
      await api('/api/transcripts/' + t.id, { method: 'DELETE' });
      if (activeId === t.id) clearOutput();
      loadHistory();
    };
    box.append(row);
  }
}
async function openTranscript(id) {
  const t = await (await api('/api/transcripts/' + id)).json();
  activeId = id; title = t.title.replace(/\.[^.]+$/, '');
  clearOutput(); t.segments.forEach(addSeg); enableExports();
  $('status').textContent = 'Saved transcript: ' + t.title;
  loadHistory();
}
function clearOutput() { segs = []; $('out').textContent = ''; ['copy','dltxt','dlsrt'].forEach(i => $(i).disabled = true); }
function enableExports() { if (segs.length) ['copy','dltxt','dlsrt'].forEach(i => $(i).disabled = false); }

// ---------- upload ----------
function pick(f) {
  file = f || null;
  $('fname').textContent = f ? f.name + ' (' + (f.size / 1048576).toFixed(1) + ' MB)' : '';
  $('go').disabled = !f;
}
$('drop').onclick = () => $('file').click();
$('file').onchange = e => pick(e.target.files[0]);
$('drop').ondragover = e => { e.preventDefault(); $('drop').classList.add('over'); };
$('drop').ondragleave = () => $('drop').classList.remove('over');
$('drop').ondrop = e => { e.preventDefault(); $('drop').classList.remove('over'); pick(e.dataTransfer.files[0]); };

const fmt = (t, comma) => {
  const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = Math.floor(t % 60), ms = Math.floor((t % 1) * 1000);
  const p = (n, l = 2) => String(n).padStart(l, '0');
  return `${p(h)}:${p(m)}:${p(s)}${comma ? ',' + p(ms, 3) : ''}`;
};
const text = () => segs.map(s => s.text).join(' ');
const srt = () => segs.map((s, i) => `${i + 1}\n${fmt(s.start, 1)} --> ${fmt(s.end, 1)}\n${s.text}\n`).join('\n');
function save(name, data) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: 'text/plain;charset=utf-8' }));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
$('copy').onclick = () => navigator.clipboard.writeText(text());
$('dltxt').onclick = () => save(title + '.txt', text());
$('dlsrt').onclick = () => save(title + '.srt', srt());
$('stop').onclick = () => ctrl && ctrl.abort();

function addSeg(s) {
  segs.push(s);
  const line = document.createElement('div');
  const ts = document.createElement('span');
  ts.className = 'ts'; ts.textContent = fmt(s.start);
  line.append(ts, document.createTextNode(s.text));
  $('out').append(line);
}

$('go').onclick = async () => {
  clearOutput(); activeId = null; title = file.name.replace(/\.[^.]+$/, '');
  $('bar').hidden = false; $('bar').value = 0;
  $('go').disabled = true; $('stop').disabled = false;
  $('status').textContent = 'Uploading...';
  ctrl = new AbortController();
  const fd = new FormData();
  fd.append('file', file); fd.append('language', $('lang').value); fd.append('hinglish', $('lang').value === 'hi');
  try {
    const res = await api('/transcribe', { method: 'POST', body: fd, signal: ctrl.signal });
    if (!res.ok) throw new Error('Server returned ' + res.status);
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
        if (!line) continue;
        const ev = JSON.parse(line);
        if (ev.type === 'status') $('status').textContent = ev.message;
        else if (ev.type === 'segment') addSeg(ev);
        else if (ev.type === 'progress') $('bar').value = ev.pct;
        else if (ev.type === 'error') $('status').textContent = 'Error: ' + ev.message;
        else if (ev.type === 'done') {
          $('bar').value = 100; $('status').textContent = 'Done. Saved to history.';
          activeId = ev.id || null; loadHistory();
        }
      }
    }
  } catch (e) {
    $('status').textContent = e.name === 'AbortError' ? 'Stopped (partial text is not saved).' : 'Failed: ' + e.message;
  }
  $('go').disabled = !file; $('stop').disabled = true; enableExports();
};

// ---------- start ----------
(async () => {
  const res = await fetch('/api/me', { credentials: 'same-origin' });
  if (res.ok) showApp(await res.json()); else showAuth();
})();
</script>
</body>
</html>
