# Two containers from one image:
#   app    - web: login, uploads, job queue, WebSocket progress (light on CPU)
#   worker - takes ONE job at a time from RabbitMQ; CPU-capped and low priority so the
#            rest of the server stays responsive however long the file is.
x-common: &common
  build: .
  image: productivity-transcriptor
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"   # reach the shared MongoDB / RabbitMQ published on the host
  environment: &env
    MONGO_URI: ${MONGO_URI:?set MONGO_URI in .env (shared MongoDB on the host)}
    MONGO_DB: transcriptor
    RABBIT_URL: ${RABBIT_URL:?set RABBIT_URL in .env (run scripts/setup-rabbitmq.sh)}
    JWT_SECRET: ${JWT_SECRET}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
    WHISPER_DEVICE: ${WHISPER_DEVICE:-auto}
    MAX_PARALLEL: ${MAX_PARALLEL:-2}
    WHISPER_BEAM: ${WHISPER_BEAM:-5}
    MODEL_DIR: /models
    HF_HOME: /models/hf        # keep all Hugging Face files on the big disk too
    TMPDIR: /data/tmp          # uploads, job files and temp audio go to the big disk
  volumes:
    - ${DATA_DIR:?set DATA_DIR in .env (run ./deploy.sh)}/models:/models:z
    - ${DATA_DIR}/tmp:/data/tmp:z

services:
  app:
    <<: *common
    ports:
      - "127.0.0.1:8000:8000"   # nginx proxies /productivity/transcriptor/ here; not public
    environment:
      <<: *env
      PRELOAD_MODEL: "false"    # the worker loads the model, not the web container

  worker:
    <<: *common
    command: ["nice", "-n", "10", "python", "worker.py"]   # lowest priority when the CPU is contended
    cpus: ${WORKER_CPUS:-4}                                # hard cap: at most this many cores
    mem_limit: ${WORKER_MEM:-6g}
    environment:
      <<: *env
      CPU_THREADS: ${WORKER_CPUS:-4}                       # Whisper threads match the cap
