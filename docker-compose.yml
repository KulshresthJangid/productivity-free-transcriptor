services:
  app:
    build: .
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach the shared MongoDB container published on the host
    ports:
      - "127.0.0.1:8000:8000"   # nginx proxies /productivity/transcriptor/ here; not public
    environment:
      MONGO_URI: ${MONGO_URI:?set MONGO_URI in .env (shared MongoDB on the host)}
      MONGO_DB: transcriptor
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-auto}
      MODEL_DIR: /models
      HF_HOME: /models/hf        # keep all Hugging Face files on the big disk too
      TMPDIR: /data/tmp          # uploads + temp audio go to the big disk
    volumes:
      - ${DATA_DIR:?set DATA_DIR in .env (run ./deploy.sh)}/models:/models:z   # model stored once, on the big disk
      - ${DATA_DIR}/tmp:/data/tmp:z

