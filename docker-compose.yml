services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - ${DATA_DIR:?set DATA_DIR in .env (run ./deploy.sh)}/mongo:/data/db   # on the big disk
    # not published to the host: only the app container can reach it

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      MONGO_DB: transcriptor
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-auto}
      MODEL_DIR: /models
      HF_HOME: /models/hf        # keep all Hugging Face files on the big disk too
      TMPDIR: /data/tmp          # uploads + temp audio go to the big disk
    volumes:
      - ${DATA_DIR:?set DATA_DIR in .env (run ./deploy.sh)}/models:/models   # model stored once, on the big disk
      - ${DATA_DIR}/tmp:/data/tmp

